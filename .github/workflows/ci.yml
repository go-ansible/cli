name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # go-ansible's freshly tagged modules can lag proxy.golang.org's
  # per-version indexing by several minutes: @latest and @v/list
  # resolve right away, while the versioned .info endpoint 404s for a
  # while after. A proxy 404 makes the go command fall through to the
  # NEXT GOPROXY entry, so naming `direct` after the proxy already
  # covers that case -- without sending every THIRD-PARTY fetch
  # straight at its origin, which is what put a golang.org 403
  # rate-limit on the critical path and turned a qemu lane red.
  GOPROXY: https://proxy.golang.org,direct
  # Same-owner modules keep the direct path and skip the transparency
  # log; go.sum still pins their content hash. Everything else is
  # checked against that log again -- GOSUMDB: "off" had been
  # disabling it for EVERY module, which is wider than the note above
  # ever intended.
  GOPRIVATE: github.com/go-ansible/*

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.3
      - run: go version
      # gofmt REPORTS, it does not fail, so the check is its OUTPUT being
      # empty. vet, build and test all pass on badly formatted code, so
      # nothing else in this job is looking -- which is how a drifted file
      # sat undetected on go-ansible/modules' main until an unrelated
      # local `gofmt -l` turned it up. This repo is clean today; the gate
      # is what keeps it that way.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      - name: Test
        run: go test ./...

  # Every ansible-* binary, built for Windows. Not a test run: the suite
  # here drives real playbooks through a POSIX shell and would fail for
  # reasons that say nothing about portability. What this job claims is
  # exactly what it checks -- that a Windows control node can be built,
  # which is something real ansible-core does not support at all.
  #
  # It exists because nothing ever built for Windows before, and a single
  # mistyped socket argument three repos down kept the whole stack from
  # compiling there without anyone finding out.
  cross:
    name: cross-compile (windows/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    env:
      CGO_ENABLED: "0"
      GOOS: windows
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.3
      - name: Build every ansible-* binary
        run: |
          set -eu
          n=0
          for c in cmd/*/; do
            GOARCH=${{ matrix.goarch }} go build -o /dev/null "./$c"
            n=$((n+1))
          done
          echo "built $n binaries for windows/${{ matrix.goarch }}"
          test "$n" -eq 9

  arch-native:
    name: arch ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    label: amd64 }
          - { os: ubuntu-24.04-arm, label: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.3
      - run: go env GOARCH && CGO_ENABLED=0 go test ./...

  arch-qemu:
    name: arch ${{ matrix.goarch }} (qemu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: riscv64, qemu: qemu-riscv64-static }
          - { goarch: loong64, qemu: qemu-loongarch64-static }
          - { goarch: ppc64le, qemu: qemu-ppc64le-static }
          - { goarch: s390x,   qemu: qemu-s390x-static }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.3
      # ⛔ `qemu-user-static` is a VIRTUAL package on Ubuntu 26.04, which
      # `ubuntu-latest` became on 2026-10-19, and apt refuses to choose between its
      # two providers:
      #
      #   E: Package 'qemu-user-static' has no installation candidate
      #
      # ⚠ Installing a provider is NOT the fix: `qemu-user-binfmt` registers binfmt
      # handlers, it does not ship the `qemu-<arch>-static` binaries this lane
      # invokes. `qemu-user` ships the dynamic `qemu-<arch>`, which is all that
      # `go test -exec` needs, so both are installed and BOTH NAMES are accepted
      # below. go-tex/engine#645 has the full account.
      - name: install qemu user-mode emulators
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y qemu-user qemu-user-binfmt
      - name: Test under qemu (${{ matrix.goarch }})
        run: |
          base="${{ matrix.qemu }}"
          q=""
          for cand in "$base" "${base%-static}"; do
            command -v "$cand" >/dev/null 2>&1 && q="$cand" && break
          done
          # ⛔ A missing emulator FAILS this lane. A lane that reports success for
          # an architecture it never ran is the one outcome this matrix exists to
          # rule out.
          if [ -z "$q" ]; then
            echo "::error::no qemu user emulator for ${{ matrix.goarch }} (looked for $base and ${base%-static})"
            exit 1
          fi
          # Printed on purpose: without it, "ran under emulation" and "skipped" are
          # indistinguishable from a green tick.
          echo "running ${{ matrix.goarch }} under $q"
          CGO_ENABLED=0 GOARCH=${{ matrix.goarch }} go test -exec="$q" ./...
