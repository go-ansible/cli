name: docker

# Builds and publishes a multi-arch OCI image bundling all eight
# go-ansible CLI binaries, FROM scratch (see Dockerfile). Runs on every
# version tag and can be triggered manually.
#
# linux/loong64 IS included: tonistiigi/binfmt (which setup-qemu-action
# installs) added loong64 emulation since this workflow was first
# written — re-verified locally (`docker buildx inspect --bootstrap`
# now lists linux/loong64 among the supported platforms) rather than
# trusting the older note that used to live here. The Dockerfile's
# build stage cross-compiles from the runner's own native architecture
# (`--platform=$BUILDPLATFORM`) instead of running under QEMU itself,
# which is also why loong64 works at all here: the official `golang`
# image publishes no loong64 variant, so a naive `--platform
# linux/loong64` build stage could never have worked even with the
# emulator installed. Verified end-to-end locally before shipping:
# built this image for linux/loong64, extracted the `ansible` binary
# (`file` confirms "ELF 64-bit LSB executable, LoongArch"), and ran it
# for real under `docker run --platform linux/loong64`, producing
# correct `--version` output under genuine QEMU emulation.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/go-ansible/cli
          # Every trigger for this workflow (a version tag, or a manual
          # dispatch) is a release — "latest" always follows it, there
          # is no separate main-branch build to distinguish it from.
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/riscv64,linux/loong64,linux/ppc64le,linux/s390x
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
